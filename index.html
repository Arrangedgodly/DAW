<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CA-1 zero-network guarantee (town-hall AC 9): Bitbounce is local-first
      forever — no telemetry, no CDN, no data leaving the device except
      explicit file exports (programmatic blob-anchor downloads, not network
      writes). This is the strongest policy a page can carry: connect-src
      'none' means NO fetch, XHR, WebSocket, EventSource, or sendBeacon
      target is ever loadable — same-origin included; every other directive
      is pinned to 'self' (the audio worklet module is a plain same-origin
      /assets/... URL in the built app, so worker-src needs no blob:). The
      meta is stripped ONLY for `vite dev`, where HMR needs inline styles +
      a ws: connection (cspDevStrip plugin in vite.config.ts); the built
      artifact users receive always carries the full policy. Guarded by
      tests/browser/zero-network.test.ts; see docs/dev/privacy.md.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; worker-src 'self'; media-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'" />
    <title>Bitbounce</title>
    <!-- res-9 critical-path preload set ONLY: the font-display:swap value/ui
         faces that ship as separate files (Departure Mono ≈ 5.9 KB, IBM Plex
         Mono 400 ≈ 10.1 KB). Silkscreen 400/700 sit under Vite's 4 KB inline
         limit and are data-URL-inlined into the CSS — zero extra request,
         already on the critical path, so preloading them again would only
         duplicate bytes. The font-display:optional faces (VT323, Press Start
         2P) and the numeric-field weight (Plex 500) are deliberately NOT
         preloaded — the stage never depends on them. -->
    <link rel="preload" href="/src/assets/fonts/departure-mono-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/ibm-plex-mono-400.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <!--
      THESIS: Bitbounce turns loop-perfect game music into something you watch
      happen: a dark arcade stage where every sound is a lit pad under a
      sweeping playhead.
      OWN-WORLD: One stage, one screen, no chrome that isn't equipment: a
      transport booth, LED pad floors, lit FX console strips, labels
      silkscreened onto the chassis. Nothing imitates an OS.
      STORY: Visitor presses play on the demo loop; the playhead sweeps, cells
      flash as they sound; curiosity drives the first edit, the grid answers
      audibly, and the loop becomes theirs.
      FIRST VIEWPORT: The booth rides on top, four labeled lane floors stack
      below, one keystroke from playing.
      FORM: Arcade Stage Floor visual world, chosen via impeccable shape +
      new-work roll, seed 102aada7.
      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, DESIGN.md, and every shipping raster
      carrying its provenance.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
