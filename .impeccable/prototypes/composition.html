<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bitbounce · Composition prototypes</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111014;color:#f5f2e9;font:13px/1.5 system-ui,sans-serif}button,select,input{font:inherit}button,select{color:inherit;background:#232128;border:1px solid #514e58;border-radius:4px;min-height:38px;padding:7px 12px;cursor:pointer}button:hover,select:hover{background:#34313a}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #f5f2e9;outline-offset:3px}button[aria-pressed=true]{background:#f5f2e9;color:#111014;border-color:#f5f2e9}header{display:flex;align-items:center;gap:24px;padding:18px 24px;border-bottom:1px solid #403d46}h1{font-size:18px;margin:0;font-weight:600;letter-spacing:-.02em}header p{margin:0;color:#c1bdc8;font-size:12px}.switch{display:flex;gap:6px;margin-left:auto}main{display:grid;grid-template-columns:minmax(0,1fr) 300px;height:calc(100dvh - 153px);min-height:530px}.stage{position:relative;overflow:hidden;background:#090a0e}canvas{display:block;width:100%;height:100%}.stage-top{position:absolute;top:20px;left:24px;right:24px;display:flex;justify-content:space-between;pointer-events:none;color:#c1bdc8;font-size:11px;letter-spacing:.06em}.stage-bottom{position:absolute;bottom:20px;left:24px;color:#c1bdc8;font-size:12px}.cross{position:absolute;width:38px;height:38px;padding:0;background:#111014;border:1px solid #aaa;border-radius:50%;transform:translate(-50%,-50%);font-size:11px;touch-action:none;cursor:grab}.cross:active{cursor:grabbing}.cross[aria-pressed=true]{background:var(--lane);color:#111014;border-color:var(--lane)}aside{border-left:1px solid #403d46;background:#1a191d;overflow:auto}aside h2{font-size:14px;margin:0}.panel-head{padding:20px;border-bottom:1px solid #403d46;display:flex;justify-content:space-between;align-items:center}.lane{padding:17px 20px;border-bottom:1px solid #403d46}.lane-title{display:flex;align-items:center;gap:9px;margin-bottom:13px;font-weight:600}.dot{display:inline-block;width:8px;height:8px;background:var(--lane)}.lane small{margin-left:auto;font-size:10px;color:#c1bdc8;letter-spacing:.08em}.fields{display:grid;grid-template-columns:1fr 92px;gap:10px}label{display:block;font-size:11px;color:#c1bdc8}select{display:block;width:100%;margin-top:5px;padding:6px;font-size:12px}.position{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:6px}.position button{min-height:15px;height:15px;padding:0;border-radius:1px;background:#34313a;border:0}.position button[aria-pressed=true]{background:var(--lane)}.scale{margin-top:13px;display:flex;align-items:center;gap:12px}.scale input{width:100%;accent-color:var(--lane)}.detail{padding:20px;color:#c1bdc8;font-size:12px}.detail h3{color:#f5f2e9;font-size:22px;margin:0 0 10px}.detail p{margin:0 0 16px}.detail svg{width:100%;height:100px;border-bottom:1px solid #403d46;margin-bottom:15px}.footer{min-height:72px;padding:14px 24px;display:flex;align-items:center;gap:12px;border-top:1px solid #403d46}.footer p{margin:0;color:#c1bdc8;font-size:12px}.primary{background:#f5f2e9;color:#111014;font-weight:600}.primary:hover{background:white}.seed{margin-left:auto;font:11px ui-monospace,monospace;color:#c1bdc8}.inspector-tabs{display:flex;gap:5px;padding:16px 20px;border-bottom:1px solid #403d46}.inspector-tabs button{flex:1;padding:6px}.chosen{padding:12px 20px;color:#c1bdc8;font-size:12px}::selection{background:#f5f2e9;color:#111014}*{scrollbar-color:#68626f #1a191d;scrollbar-width:thin}@media(max-width:800px){header{flex-wrap:wrap;gap:12px;padding:12px}.switch{margin-left:0;width:100%}.switch button{flex:1}main{height:auto;min-height:0;grid-template-columns:1fr}.stage{height:52dvh;min-height:350px}aside{border-left:0}.footer{flex-wrap:wrap;padding:12px}.seed{margin-left:0}button{min-height:44px}.stage-top{left:12px;right:12px}aside .lane{padding:14px 20px}.position button{height:22px;min-height:22px}}
</style></head><body>
<header><div><h1>Bitbounce / Visual composition</h1><p>Interactive design study · simulated notes · no DAW audio connection</p></div><nav class="switch" aria-label="Prototype layout"><button id="mixer" aria-pressed="true">A · Four instrument controls</button><button id="inspector" aria-pressed="false">B · Canvas + inspector</button></nav></header>
<main><section class="stage" aria-label="Composition preview"><canvas aria-label="Animated geometric composition"></canvas><div class="stage-top"><span>COMPOSITION / LIVE PREVIEW</span><span id="motion">SIMULATED · 112 BPM</span></div><div id="anchors"></div><div class="stage-bottom" id="hint">Every instrument has its own effect and screen position.</div></section><aside id="controls" aria-label="Instrument controls"></aside></main>
<div class="footer"><button class="primary" id="reroll">Reroll composition</button><button id="pause" aria-pressed="false">Pause preview</button><p id="feedback" aria-live="polite">Change any effect. Place it. Let the layers play together.</p><span class="seed" id="seed">SEED / 48271</span></div>
<script type="module">
const names=['Drums','Bass','Chords','Lead'],colors=['#f23d4c','#ffb300','#35d07f','#4da6ff'];
const effects=['Orbit lattice','Contour field','Prism mesh','Particle current','Radial fractures','Interference'];
const descriptions=['Interlocking elliptical paths rotate in depth. Note energy opens the structure and lights its moving vertices.','Nested contours twist around a shared center. Pitched notes change the contour spacing and the fold of the field.','A curved triangular mesh flexes with each note. Chord activity spreads across the connected faces.','A flowing field of points traces interwoven paths. Note energy lengthens the trails and opens the current.','Concentric segments split and rotate at different rates. Each strike sends a fresh expansion through the structure.','Intersecting wave families form a dense moving interference pattern. Notes stretch their frequency and spread.'];
let lanes=names.map((name,i)=>({name,color:colors[i],effect:[4,1,2,3][i],x:[.3,.68,.32,.7][i],y:[.32,.33,.7,.7][i],scale:80}));
let mode='mixer',selected=0,seed=48271,paused=matchMedia('(prefers-reduced-motion: reduce)').matches;
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),stage=document.querySelector('.stage'),controls=document.querySelector('#controls');
let W=0,H=0,time=0,last=0,visible=true;new ResizeObserver(()=>{W=stage.clientWidth;H=stage.clientHeight;const d=Math.min(devicePixelRatio,2);canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0)}).observe(stage);
function random(){seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;return(seed>>>0)/4294967296}
function positionName(x,y){return ['Top','Middle','Bottom'][y]+ ' '+['left','center','right'][x]}
function laneHTML(l,i){return `<section class="lane" style="--lane:${l.color}"><div class="lane-title"><span class="dot"></span>${l.name}<small>${String(i+1).padStart(2,'0')}</small></div><div class="fields"><label>Visual effect<select data-effect="${i}" aria-label="${l.name} visual effect">${effects.map((e,n)=>`<option value="${n}" ${n===l.effect?'selected':''}>${e}</option>`).join('')}</select></label><div><label>${mode==='mixer'?'Screen position':'Snap position'}</label><div class="position" role="group" aria-label="${l.name} screen position">${Array.from({length:9},(_,n)=>{const x=n%3,y=Math.floor(n/3);return `<button data-position="${i},${x},${y}" title="${positionName(x,y)}" aria-label="${l.name} ${positionName(x,y)}" aria-pressed="${Math.abs(l.x-(.2+x*.3))<.04&&Math.abs(l.y-(.2+y*.3))<.04}"></button>`}).join('')}</div></div></div><label class="scale">Scale<input type="range" min="35" max="130" value="${l.scale}" data-scale="${i}" aria-label="${l.name} visual scale"></label></section>`}
function anchors(){document.querySelector('#anchors').innerHTML=mode==='inspector'?lanes.map((l,i)=>`<button class="cross" data-lane="${i}" style="left:${l.x*100}%;top:${l.y*100}%;--lane:${l.color}" aria-label="Select and move ${l.name}" aria-pressed="${i===selected}" title="Drag ${l.name}; arrow keys move">${l.name.slice(0,2).toUpperCase()}</button>`).join(''):''}
function render(){document.querySelector('#mixer').setAttribute('aria-pressed',mode==='mixer');document.querySelector('#inspector').setAttribute('aria-pressed',mode==='inspector');document.querySelector('#hint').textContent=mode==='mixer'?'Every instrument has its own effect and screen position.':'Select a handle. Drag to compose. Arrow keys move the selected handle.';controls.innerHTML=`<div class="panel-head"><h2>${mode==='mixer'?'Instrument layers':'Selected instrument'}</h2><span style="color:#c1bdc8;font-size:11px">${mode==='mixer'?'4 LAYERS':'DIRECT PLACEMENT'}</span></div>`+(mode==='mixer'?lanes.map(laneHTML).join(''):`<nav class="inspector-tabs" aria-label="Select instrument">${lanes.map((l,i)=>`<button data-select="${i}" aria-label="Select ${l.name}" aria-pressed="${i===selected}">${l.name.slice(0,2).toUpperCase()}</button>`).join('')}</nav>${laneHTML(lanes[selected],selected)}<div class="detail"><h3>${effects[lanes[selected].effect]}</h3><p>${descriptions[lanes[selected].effect]}</p><p>Move this instrument anywhere on the canvas. Other layers keep their effect, size, and placement.</p><p>Position ${Math.round(lanes[selected].x*100)}% / ${Math.round(lanes[selected].y*100)}%</p></div>`);anchors()}
function note(text){document.querySelector('#feedback').textContent=text}
document.querySelector('#mixer').onclick=()=>{mode='mixer';render()};document.querySelector('#inspector').onclick=()=>{mode='inspector';render()};
controls.addEventListener('change',e=>{if(e.target.dataset.effect!==undefined){const i=+e.target.dataset.effect;lanes[i].effect=+e.target.value;note(`${names[i]} · ${effects[lanes[i].effect]}`);if(mode==='inspector'){const f=e.target;render();controls.querySelector('select').focus()}}});
controls.addEventListener('input',e=>{if(e.target.dataset.scale!==undefined)lanes[+e.target.dataset.scale].scale=+e.target.value});
controls.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.select!==undefined){selected=+t.dataset.select;render();controls.querySelector(`[data-select="${selected}"]`).focus()}if(t.dataset.position){const [i,x,y]=t.dataset.position.split(',').map(Number);lanes[i].x=.2+x*.3;lanes[i].y=.2+y*.3;render();controls.querySelector(`[data-position="${i},${x},${y}"]`).focus();note(`${names[i]} moved to ${positionName(x,y).toLowerCase()}.`)}});
const anchorRoot=document.querySelector('#anchors');let drag=null;
anchorRoot.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b)return;selected=+b.dataset.lane;drag={id:e.pointerId,i:selected};b.setPointerCapture(e.pointerId);anchorRoot.querySelectorAll('button').forEach((a,i)=>a.setAttribute('aria-pressed',i===selected))});
anchorRoot.addEventListener('pointermove',e=>{if(!drag)return;const r=stage.getBoundingClientRect(),l=lanes[drag.i];l.x=Math.max(.08,Math.min(.92,(e.clientX-r.left)/r.width));l.y=Math.max(.1,Math.min(.9,(e.clientY-r.top)/r.height));e.target.style.left=l.x*100+'%';e.target.style.top=l.y*100+'%'});
anchorRoot.addEventListener('pointerup',()=>{if(!drag)return;drag=null;render();anchorRoot.querySelector(`[data-lane="${selected}"]`).focus()});anchorRoot.addEventListener('pointercancel',()=>{drag=null;render()});
anchorRoot.addEventListener('keydown',e=>{if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter',' '].includes(e.key))return;e.preventDefault();selected=+e.target.dataset.lane;const l=lanes[selected],d=e.shiftKey?.05:.01;if(e.key==='ArrowLeft')l.x=Math.max(.08,l.x-d);if(e.key==='ArrowRight')l.x=Math.min(.92,l.x+d);if(e.key==='ArrowUp')l.y=Math.max(.1,l.y-d);if(e.key==='ArrowDown')l.y=Math.min(.9,l.y+d);render();anchorRoot.querySelector(`[data-lane="${selected}"]`).focus()});
document.querySelector('#reroll').onclick=()=>{const s=(seed+0x9e3779b9)>>>0;seed=s;lanes.forEach(l=>{l.effect=Math.floor(random()*effects.length);l.x=.18+random()*.64;l.y=.2+random()*.6;l.scale=65+random()*30});document.querySelector('#seed').textContent='SEED / '+s;render();note('All four instruments received a random effect and position.')};
function pauseUI(){document.querySelector('#pause').textContent=paused?'Resume preview':'Pause preview';document.querySelector('#pause').setAttribute('aria-pressed',paused);document.querySelector('#motion').textContent=paused?'SIMULATION PAUSED':'SIMULATED · 112 BPM'}document.querySelector('#pause').onclick=()=>{paused=!paused;pauseUI()};matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',e=>{paused=e.matches;pauseUI()});document.addEventListener('visibilitychange',()=>{visible=!document.hidden;last=0});
function path(points,alpha=.5,width=.75){ctx.globalAlpha=alpha;ctx.lineWidth=width;ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke()}
function drawLayer(l,i,t){const beat=t*112/60,pulse=Math.exp(-((beat*[2,1,.5,1.5][i]+i*.27)%1)*4),r=Math.min(W,H)*.24*l.scale/80;ctx.save();ctx.translate(l.x*W,l.y*H);ctx.strokeStyle=l.color;ctx.fillStyle=l.color;const spin=t*.08+i;
 if(l.effect===0){for(let j=0;j<22;j++){const a=j/22*Math.PI,pts=[];for(let k=0;k<=100;k++){const q=k/100*Math.PI*2;let x=Math.cos(q)*r*(1+pulse*.09),y=Math.sin(q)*r*.36;pts.push([x*Math.cos(a+spin)-y*Math.sin(a+spin),x*Math.sin(a+spin)+y*Math.cos(a+spin)])}path(pts,.24+(.5*j/22),.65)}}
 if(l.effect===1){for(let j=0;j<34;j++){const pts=[],rr=r*(.22+j/45);for(let k=0;k<=160;k++){const a=k/160*Math.PI*2;const v=rr*(1+.17*Math.sin(a*3+spin+j*.11)+.09*Math.cos(a*5-t*.4));pts.push([Math.cos(a)*v,Math.sin(a)*v*.72])}path(pts,.25+j/60,.7)}}
 if(l.effect===2){const point=(u,v)=>{const a=u/22*Math.PI*2,b=v/12*Math.PI;const rr=r*(.7+.13*Math.sin(a*3+t*.3));return[Math.cos(a+spin)*Math.sin(b)*rr,Math.cos(b)*rr*.78+Math.sin(a+spin)*Math.sin(b)*rr*.28]};for(let v=0;v<12;v++)for(let u=0;u<22;u++){path([point(u,v),point(u+1,v),point(u+1,v+1),point(u,v)],.2+v/30,.6);if((u+v)%5===0){const p=point(u,v);ctx.globalAlpha=.9;ctx.fillRect(p[0],p[1],1.5+pulse,1.5+pulse)}}}
 if(l.effect===3){for(let j=0;j<320;j++){const q=j*.371+t*.22,rr=r*Math.sqrt(j/320),x=Math.cos(q)*rr,y=Math.sin(q*1.03)*rr*.65;ctx.globalAlpha=.35+(j%7)/12;const s=.7+pulse*(j%4)*.35;ctx.fillRect(x,y,s,s);if(j%3===0)path([[x,y],[x+Math.cos(q+.7)*(8+pulse*17),y+Math.sin(q+.7)*8]],.4,.65)}}
 if(l.effect===4){for(let j=0;j<17;j++){const rr=r*(.12+j/19)*(1+pulse*.08);for(let n=0;n<12;n++){const a=n/12*Math.PI*2+spin*(j%2?1:-1)+j*.04,pts=[];for(let k=0;k<9;k++){const q=a+k/9*.38;pts.push([Math.cos(q)*rr,Math.sin(q)*rr*.84])}path(pts,.24+j/25,j%4===0?1.7:.65)}}}
 if(l.effect===5){for(let j=0;j<46;j++){const pts=[];for(let k=0;k<=110;k++){const x=(k/110-.5)*r*2;const y=Math.sin(x/r*4+spin+j*.08)*r*.23+(j-23)*r/44;pts.push([x*Math.cos(.4)-y*Math.sin(.4),x*Math.sin(.4)+y*Math.cos(.4)])}path(pts,.3+j/100,.65)}}
 ctx.restore()}
function frame(ms){requestAnimationFrame(frame);if(!visible)return;if(!paused&&last)time+=Math.min((ms-last)/1000,.05);last=ms;ctx.globalAlpha=1;ctx.fillStyle='#090a0e';ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='lighter';lanes.forEach((l,i)=>drawLayer(l,i,time));ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1}render();pauseUI();requestAnimationFrame(frame);
</script></body></html>
