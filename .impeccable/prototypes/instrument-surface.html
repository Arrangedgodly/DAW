<body data-theme="ion"><header class="transport"><div class="brand">bitbounce<span>.</span></div><div class="transport-group"><button class="play" aria-pressed="false"><svg viewBox="0 0 12 14" aria-hidden="true"><path d="M1 0L12 7 1 14Z"/></svg><span>Play</span></button><button class="loop" aria-pressed="true">Loop</button><button class="extra" aria-pressed="false" id="metro">Click</button><div class="metric"><strong>112</strong><small>BPM</small></div></div><div class="transport-group extra"><button aria-pressed="true">Edit</button><span style="color:var(--muted);padding:8px">Song</span><span style="color:var(--muted);padding:8px">Viz</span></div><div class="metric extra"><small>KEY</small><strong style="font-size:14px">C minor</strong></div><div class="project"><b>Midnight circuit</b>Demo pattern · visual study</div></header>

<script>
const lanes=[{id:'drums',name:'Drums',voice:'Soft step',alts:['Soft step','Circuit kit','Dry machine'],origin:36},{id:'bass',name:'Bass',voice:'Round triangle',alts:['Round triangle','Sub pulse','Soft saw'],origin:36},{id:'chords',name:'Chords',voice:'Soft pulse',alts:['Soft pulse','Glass pad','Warm triangle'],origin:48},{id:'lead',name:'Lead',voice:'Ultra triangle',alts:['Ultra triangle','Bright square','Soft lead'],origin:60}];
const intervals=[0,2,3,5,7,8,10], names=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];const noteName=m=>names[((m%12)+12)%12]+(Math.floor(m/12)-1);let playing=false,timer,step=0,selected='drums';const notes={};let theme=new URLSearchParams(location.search).get('theme')||'ion';document.body.dataset.theme=theme;
lanes.forEach((l,li)=>{notes[l.id]=new Set();for(let row=0;row<7;row++)for(let col=0;col<16;col++){let on=li===0?(row===6&&col%4===0)||(row===5&&col%8===4)||(row===4&&col%2===0):li===1?(row===6&&[0,1,4,5,8,9,12].includes(col))||(row===4&&col===14):li===2?([2,4,6].includes(row)&&((col>=0&&col<6)||(col>=8&&col<14))):[[6,0],[4,3],[2,5],[3,7],[1,10],[2,12],[4,14]].some(([r,c])=>r===row&&c===col);if(on)notes[l.id].add((l.origin+intervals[6-row])+':'+col)}});
function rows(l){return Array.from({length:12},(_,i)=>l.origin+i).filter(m=>intervals.includes(m%12)).reverse()}
function drawGrid(l,el){const pitchRows=l.id==='drums'?['Kick','Snare','Hat','Open','Clap','Tom'].reverse():rows(l);el.querySelector('.labels').innerHTML='<div></div>'+pitchRows.map(p=>'<div class="'+(typeof p==='number'&&p%12===0?'root':'')+'">'+(typeof p==='number'?noteName(p):p)+'</div>').join('');const cells=el.querySelector('.cells');cells.style.gridTemplateRows='repeat('+pitchRows.length+',1fr)';el.querySelector('.labels').style.gridTemplateRows='20px repeat('+pitchRows.length+',1fr)';cells.innerHTML='';pitchRows.forEach((p,r)=>{for(let c=0;c<16;c++){const midi=l.id==='drums'?l.origin+intervals[5-r]:p;const key=midi+':'+c;const b=document.createElement('button');const on=notes[l.id].has(key);b.className='cell'+(on?' on':'')+(on&&notes[l.id].has(midi+':'+(c+1))?' sustain':'')+(on&&notes[l.id].has(midi+':'+(c-1))?' end':'');b.style.setProperty('--col',c);b.setAttribute('aria-label',l.name+' '+(typeof p==='number'?noteName(p):p)+' step '+(c+1));b.setAttribute('aria-pressed',String(on));b.onclick=()=>{notes[l.id].has(key)?notes[l.id].delete(key):notes[l.id].add(key);drawGrid(l,el)};cells.append(b)}});el.querySelector('.pitch').textContent=l.id==='drums'?'6 drum voices':noteName(l.origin)+' – '+noteName(l.origin+11);}
function panel(l,idx){const el=document.createElement('section');el.className='instrument'+(idx===0?' selected':'');el.dataset.lane=l.id;el.setAttribute('aria-label',l.name+' instrument');el.innerHTML='<div class="head"><div class="identity"><h2><i class="mark"></i>'+l.name+'</h2><small>Pattern A · 1 bar</small></div><div class="sound"><select aria-label="'+l.name+' sound">'+l.alts.map(v=>'<option>'+v+'</option>').join('')+'</select></div><div class="volume"><input type="range" min="0" max="100" value="80" aria-label="'+l.name+' volume"></div><div class="mix"><button class="mute" aria-label="Mute '+l.name+'" aria-pressed="false">M</button><button class="solo" aria-label="Solo '+l.name+'" aria-pressed="false">S</button></div></div><div class="toolrow"><span class="muted">C minor</span><span class="space"></span><span class="muted">Gate</span><button class="gate">1/16</button><button class="fx" aria-expanded="false">FX · 2</button></div><div class="canvas"><div class="labels"></div><div class="roll"><div class="ruler"><span>1</span><span>2</span><span>3</span><span>4</span></div><div class="cells"></div><div class="playhead"></div></div></div><div class="foot">'+(l.id!=='drums'?'<div class="range"><button data-shift="-12" aria-label="'+l.name+' view down one octave">−</button><span class="unit">Octave</span><button data-shift="12" aria-label="'+l.name+' view up one octave">+</button><button data-shift="-1" aria-label="'+l.name+' view down one semitone">−</button><span class="unit">Semi</span><button data-shift="1" aria-label="'+l.name+' view up one semitone">+</button></div>':'<span style="color:var(--muted);font-size:11px">Step sequencer</span>')+'<span class="pitch"></span><span class="follow">Next · <b>Slot 1 / A</b></span></div>';document.querySelector('.workspace').append(el);drawGrid(l,el);
el.querySelectorAll('[data-shift]').forEach(b=>b.onclick=()=>{l.origin=Math.max(0,Math.min(116,l.origin+Number(b.dataset.shift)));drawGrid(l,el);el.querySelectorAll('[data-shift]').forEach(x=>x.disabled=Number(x.dataset.shift)<0?l.origin===0:l.origin===116)});
el.querySelector('.mute').onclick=e=>{const on=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',on);el.classList.toggle('muted-lane',on)};
el.querySelector('.solo').onclick=e=>{const on=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',on);document.querySelectorAll('.instrument').forEach(x=>x.classList.toggle('muted-lane',on&&x!==el))};
el.querySelector('.gate').onclick=e=>{const values=['1/16','1/8','1/4','1/2'];e.currentTarget.textContent=values[(values.indexOf(e.currentTarget.textContent)+1)%4]};
el.querySelector('.fx').onclick=()=>{const old=el.querySelector('.fxsheet');if(old){old.remove();el.querySelector('.fx').setAttribute('aria-expanded','false');return}const sheet=document.createElement('div');sheet.className='fxsheet';sheet.innerHTML='<header><strong>'+l.name+' effects</strong><button>Close</button></header><label>Filter cutoff <input aria-label="Filter cutoff" type="range" value="70"></label><label>Delay mix <input aria-label="Delay mix" type="range" value="25"></label><label>Reverb mix <input aria-label="Reverb mix" type="range" value="35"></label><p style="color:var(--muted);font-size:11px">Control styling preview. Audio is not connected.</p>';sheet.querySelector('button').onclick=()=>{sheet.remove();el.querySelector('.fx').setAttribute('aria-expanded','false')};el.append(sheet);el.querySelector('.fx').setAttribute('aria-expanded','true')};}
lanes.forEach(panel);document.querySelector('.play').onclick=()=>{playing=!playing;document.body.classList.toggle('playing',playing);document.querySelector('.play').setAttribute('aria-pressed',playing);document.querySelector('.play span').textContent=playing?'Stop':'Play';document.querySelector('#state').textContent=playing?'Visual playback':'Ready to play';clearInterval(timer);if(playing)timer=setInterval(()=>{step=(step+1)%16;document.querySelector('#position').textContent='1.'+(Math.floor(step/4)+1)+'.'+(step%4+1)},500);else{step=0;document.querySelector('#position').textContent='1.1.1'}};
document.querySelectorAll('.loop,#metro').forEach(b=>b.onclick=()=>b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true'));document.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{selected=b.dataset.select;document.querySelectorAll('[data-select]').forEach(x=>x.setAttribute('aria-pressed',x===b));document.querySelectorAll('.instrument').forEach(x=>x.classList.toggle('selected',x.dataset.lane===selected))});
